name: pyroptosis_timelapse_env
channels:
  - conda-forge
  - anaconda
dependencies:
  - python=3.12
  - conda-forge::pip
  - conda-forge::numpy>=2.0
  - conda-forge::pandas
  - conda-forge::ipykernel
  - conda-forge::jupyter
  - conda-forge::matplotlib
  - conda-forge::seaborn
  - conda-forge::umap-learn
  - conda-forge::pyarrow
  - pip:
    - tqdm
    - natsort
    - bioio
    - bioio-tifffile
    - -e ../utils
    - imageio[pyav]

name: timelapse_ibp_env

channels:
- conda-forge
- anaconda
- pytorch

dependencies:
- conda-forge::python=3.12
- conda-forge::ipykernel
- conda-forge::nbconvert
- conda-forge::pip
- conda-forge::numpy>=2.0
- conda-forge::pyyaml
- conda-forge::matplotlib
- conda-forge::seaborn
- conda-forge::pandas
- conda-forge::polars
- conda-forge::duckdb
- pip
- pip:
    - dask[array,distributed]>=2024.1.0
    - cytotable==1.2.6
    - pycytominer==1.7.1
    - cosmicqc==1.1.2
    - natsort
    - -e ../utils/

